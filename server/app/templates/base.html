<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}لوحة الأهل{% endblock %} · دراستي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if request.session.get('user') %}
<header class="top">
  <a class="brand" href="/">لوحة الأهل</a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'home' }}">الأولاد</a>
    <a href="/assignments" class="{{ 'on' if nav == 'assign' }}">الاختبارات</a>
    <form method="post" action="/logout"><button class="link">خروج</button></form>
  </nav>
</header>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
